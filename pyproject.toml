[project]
name = "bookweaver-backend"
version = "2.0.0"
description = "BookWeaver AI Backend service"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.18",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "markdownify>=1.2.3",
    "openai>=1.50.0",
    "pillow>=12.3.0",
    "pydantic>=2.9.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "pywhispercpp>=1.5.0",
    "requests>=2.32.0",
    "soundfile>=0.12.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
