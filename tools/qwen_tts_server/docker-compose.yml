name: qwen3-tts

services:
  qwen_tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen3_tts_service
    ports:
      - "9233:9233"
    environment:
      - PORT=9233
      - HOST=0.0.0.0
      - QWEN_TTS_MODEL=Qwen/Qwen3-TTS-12Hz-1.7B-Base
      - DEFAULT_LANGUAGE=Russian
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
